<div class="shell">
  <aside class="sidenav">
    <div class="brand">
      <h1 class="t-heading">AZUMA</h1>
      <span class="t-label">{{ t('app.tagline') }}</span>
    </div>

    <nav class="nav">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="t-label nav-link"
      >
        [ {{ t('nav.analyzer') }} ]
      </a>
      <a routerLink="/history" routerLinkActive="active" class="t-label nav-link">
        [ {{ t('nav.history') }} ]
      </a>
      <a routerLink="/exports" routerLinkActive="active" class="t-label nav-link">
        [ {{ t('nav.exports') }} ]
      </a>
    </nav>

    <div class="sidenav-foot">
      <span
        class="t-label status-label"
        [class.text-success]="backendOnline"
        [class.text-accent]="!backendOnline"
      >
        [{{ backendOnline ? 'BACKEND ONLINE' : 'BACKEND OFFLINE' }}]
      </span>
      <button type="button" class="side-btn" (click)="toggleLocale()">
        {{ localeLabel() }}
      </button>
      <button type="button" class="side-btn" (click)="toggleTheme()">
        {{ themeLabel() }}
      </button>
    </div>
  </aside>

  <main class="content dot-grid-subtle">
    <router-outlet />
  </main>
</div>
